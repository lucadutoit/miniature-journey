org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# Lets Android Studio sync Gradle projects in parallel (ignored by older Android Studio versions)
org.gradle.tooling.parallel=true

# No org.gradle.java.home here on purpose: everyone's JDK lives somewhere different.
# Android Studio uses its own bundled JDK. To run ./gradlew from a terminal, JAVA_HOME must be
# a JDK 17-21 (see README).
