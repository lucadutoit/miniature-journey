name: Android CI & APK Build

on:
  push:
    branches: [ "main", "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-android:
    name: Run Android Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Upload Test Results on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  test-analysis:
    name: Test Python Analysis Script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'analysis/requirements.txt'

      - name: Install Python dependencies
        run: pip install -r analysis/requirements.txt

      - name: Execute analysis on sample data
        run: |
          cd analysis
          python analyse.py sample_trials.csv

  build-apk:
    name: Build & Package APKs
    needs: [test-android, test-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble Debug and Release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: S15CodecTest-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: S15CodecTest-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
